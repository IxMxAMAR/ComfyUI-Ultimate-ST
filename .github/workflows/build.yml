name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ixmxamar/comfyui-ultimate-st

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      # Runs on Linux, so the symlink assertions the Windows dev box has to
      # skip are actually enforced here.
      - name: Run the bash unit tests
        run: bash tests/run_tests.sh

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: false
          swap-storage: false

      # No CUDA compile here, so no swapfile is needed — but the ~13.5GB base
      # image unpacks to ~35GB and will not fit on the runner's / partition.
      - name: Relocate Docker storage to /mnt (~70GB)
        run: |
          sudo systemctl stop docker docker.socket || true
          sudo mkdir -p /mnt/docker
          echo '{ "data-root": "/mnt/docker" }' | sudo tee /etc/docker/daemon.json
          sudo systemctl start docker
          docker info | grep -i "docker root dir" || true
          df -h / /mnt || true

      - uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build image (load locally)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE }}:ci-${{ github.sha }}
          provenance: false

      - name: SillyTavern auth gate (401 without creds, 200 with)
        run: docker run --rm --entrypoint bash ${{ env.IMAGE }}:ci-${{ github.sha }} /opt/scripts/ci_st_gate.sh

      - name: ComfyUI node-import gate (inherited from the base image, OFFLINE)
        run: docker run --rm --network none --entrypoint bash ${{ env.IMAGE }}:ci-${{ github.sha }} /opt/scripts/ci_node_import_gate.sh

      - name: Tag + push (only after gates pass)
        if: github.event_name != 'pull_request'
        run: |
          SHA=$(echo "${{ github.sha }}" | cut -c1-12)
          docker tag ${{ env.IMAGE }}:ci-${{ github.sha }} ${{ env.IMAGE }}:latest
          docker tag ${{ env.IMAGE }}:ci-${{ github.sha }} ${{ env.IMAGE }}:$SHA
          docker push ${{ env.IMAGE }}:latest
          docker push ${{ env.IMAGE }}:$SHA
